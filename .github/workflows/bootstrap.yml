name: bootstrap-workstation

on:
  push:
    branches:
      - feat/brand-content-workstation
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/brand-content-workstation
          fetch-depth: 0

      - name: Verify and unpack workstation source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/chunk00 \
            .bootstrap/fix01a \
            .bootstrap/fix01b \
            .bootstrap/fix01c \
            .bootstrap/fix01d \
            .bootstrap/fix01e \
            .bootstrap/chunk02 \
            .bootstrap/chunk03 \
            .bootstrap/fix04a \
            .bootstrap/fix04b \
            .bootstrap/fix04c \
            .bootstrap/fix04d \
            .bootstrap/fix04e \
            .bootstrap/chunk05 \
            | base64 --decode > /tmp/myworkshop.tar.gz
          echo "15d3b7deba5e04317988bb8683d4ddaea53cf1991b9fd335b6302a624f266e26  /tmp/myworkshop.tar.gz" | sha256sum --check -
          tar --extract --gzip --file /tmp/myworkshop.tar.gz --no-same-owner
          rm -rf .bootstrap
          rm -f .github/workflows/test.yml

          python - <<'PY'
          from pathlib import Path

          render = Path("app/render.py")
          text = render.read_text()
          old = "from pathlib import Path\nfrom typing import Iterable\n"
          new = "from collections.abc import Iterable\nfrom pathlib import Path\n"
          if old not in text:
              raise SystemExit("expected render import block not found")
          render.write_text(text.replace(old, new, 1))

          web = Path("app/web.py")
          text = web.read_text()
          old = "from pathlib import Path\n\nfrom fastapi"
          new = "from pathlib import Path\nfrom typing import Annotated\n\nfrom fastapi"
          if old not in text:
              raise SystemExit("expected web import block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "file: UploadFile = File(...)",
              "file: Annotated[UploadFile, File()]",
          )
          if "file: UploadFile = File(...)" in text:
              raise SystemExit("unsafe FastAPI File defaults remain")
          web.write_text(text)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint and normalize source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          planner = Path("app/planner.py")
          text = planner.read_text()
          unused = "            names = [item[0] for item in group]\n"
          if unused not in text:
              raise SystemExit("expected unused planner assignment not found")
          planner.write_text(text.replace(unused, "", 1))
          PY
          ruff check . --fix
          ruff check .

      - name: Test
        run: pytest -q

      - name: Compile
        run: python -m compileall -q app tests

      - name: Commit complete implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add brand-consistent AI content workstation"
          git push origin HEAD:feat/brand-content-workstation
